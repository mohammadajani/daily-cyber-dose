name: Hermes Lite — cyber dose

on:
  schedule:
    # GitHub Actions cron is always UTC. These correspond to:
    #   10:20 IST -> 04:50 UTC
    #   20:15 IST -> 14:45 UTC
    - cron: '50 4 * * *'
    - cron: '45 14 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Scheduled runs firing close together (or a manual run overlapping a
# scheduled one) would otherwise race on the hermes.db commit below — this
# makes the second wait for the first instead, the CI equivalent of the
# local .hermes.lock file (which doesn't help here since every run gets a
# brand-new, disposable VM).
concurrency:
  group: hermes-lite-run
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated hermes.db back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Hermes Lite
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDERS: groq,gemini
        run: python3 news_bot.py

      # Runners are thrown away after every job — without this, hermes.db
      # resets to empty every run and old articles would look "new" again
      # and get re-sent. Committing it back is the simplest way to persist
      # state without standing up any external storage.
      #
      # The plain "git push" here can get rejected if anything else lands
      # on main between this job's checkout and this step — a direct edit
      # via the GitHub web UI, another collaborator's commit, etc. (the
      # concurrency group above only serializes runs of THIS workflow, not
      # unrelated pushes to the repo). That's a normal, recoverable race,
      # not a real failure — so on rejection, sync to whatever main now is
      # and re-apply THIS run's hermes.db on top, rather than trying to
      # merge/rebase (which has its own footguns with a binary file and
      # isn't needed here — the file's *content* is what matters, not a
      # meaningful commit history for it).
      - name: Persist seen/sent state
        run: |
          git config user.name "hermes-lite-bot"
          git config user.email "actions@users.noreply.github.com"

          cp hermes.db /tmp/hermes.db.thisrun

          for attempt in 1 2 3 4 5; do
            git add hermes.db
            if git diff --cached --quiet; then
              echo "No state changes to persist."
              exit 0
            fi
            git commit -q -m "chore: update hermes-lite state [skip actions]"
            if git push; then
              echo "Pushed state successfully (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — main moved since checkout. Syncing and retrying..."
            git fetch origin main -q
            git reset --hard origin/main -q
            cp /tmp/hermes.db.thisrun hermes.db
            sleep $((attempt * 2))
          done

          echo "::error::Could not push hermes-lite state after 5 attempts — check for a stuck workflow run."
          exit 1
